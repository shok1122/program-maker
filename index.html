<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学会タイムテーブル作成ツール</title>
<style>
  :root{
    --ink:#1e293b;
    --ink-soft:#64748b;
    --ink-faint:#94a3b8;
    --paper:#ffffff;
    --panel:#f8fafc;
    --panel-2:#f1f5f9;
    --border:#e2e8f0;
    --border-strong:#cbd5e1;
    --accent:#4f46e5;
    --accent-soft:#eef2ff;
    --talk:#64748b;
    --lunch:#f59e0b;   --lunch-bg:#fffbeb;
    --break:#10b981;   --break-bg:#ecfdf5;
    --custom:#6366f1;  --custom-bg:#eef2ff;
    --gap:#cbd5e1;
    --danger:#dc2626;
    --mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--panel-2);
    line-height:1.55;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}

  header.masthead{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:16px;flex-wrap:wrap;
    padding-bottom:18px;margin-bottom:24px;
    border-bottom:2px solid var(--ink);
  }
  .masthead h1{
    margin:0;font-size:22px;font-weight:700;letter-spacing:.01em;
    display:flex;align-items:baseline;gap:12px;
  }
  .masthead h1 .en{
    font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.14em;
    color:var(--ink-faint);text-transform:uppercase;
  }
  .masthead .summary{
    font-family:var(--mono);font-size:12px;color:var(--ink-soft);
    display:flex;gap:18px;
  }
  .masthead .summary b{color:var(--ink);font-weight:600}

  .layout{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
  @media (max-width:920px){ .layout{grid-template-columns:1fr} }

  .panel{
    background:var(--paper);border:1px solid var(--border);border-radius:12px;
    padding:18px 18px 20px;
  }
  .panel + .panel{margin-top:18px}
  .panel h2{
    margin:0 0 14px;font-size:12px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-soft);
    display:flex;align-items:center;gap:8px;
  }
  .panel h2::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--accent)}

  .field{margin-bottom:13px}
  .field:last-child{margin-bottom:0}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  input[type=time],input[type=number],input[type=text],select{
    width:100%;font-family:inherit;font-size:14px;color:var(--ink);
    background:var(--paper);border:1px solid var(--border-strong);border-radius:7px;
    padding:8px 9px;transition:border-color .12s,box-shadow .12s;
  }
  input[type=time],input[type=number]{font-family:var(--mono)}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .inline-check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
  .inline-check input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

  .types{display:flex;flex-direction:column;gap:9px}
  .type-row{
    display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;
    padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--panel);
  }
  .type-row .head{grid-column:1/2;grid-row:1/2;display:flex;align-items:center;gap:8px}
  .type-row .swatch{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .type-row .kill{grid-column:2/3;grid-row:1/3}
  .type-row .nums{grid-column:1/2;grid-row:2/3;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .type-row input[type=number]{padding:6px 7px;font-size:13px}
  .mini{display:block;font-size:10px;font-weight:600;letter-spacing:.03em;color:var(--ink-faint);margin-bottom:2px}
  .type-empty{font-size:12px;color:var(--ink-faint);text-align:center;padding:6px 0}

  .slots{display:flex;flex-direction:column;gap:9px}
  .slot-row{
    display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;
    padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--panel);
  }
  .slot-row .times{display:grid;grid-template-columns:1fr 1fr;gap:6px;grid-column:1/3}
  .slot-row .name{grid-column:1/2}
  .slot-row .type{grid-column:2/3}
  .slot-row .kill{grid-column:3/4;grid-row:1/3;align-self:stretch}
  .slot-empty{font-size:12px;color:var(--ink-faint);text-align:center;padding:6px 0}

  button{font-family:inherit;cursor:pointer;border:none;border-radius:7px;font-weight:600;transition:background .12s,border-color .12s,color .12s}
  .btn{padding:9px 14px;font-size:13px;background:var(--accent);color:#fff}
  .btn:hover{background:#4338ca}
  .btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--border-strong)}
  .btn.ghost:hover{background:var(--panel);border-color:var(--ink-faint)}
  .btn.block{width:100%;justify-content:center}
  .btn.small{padding:7px 11px;font-size:12px}
  .kill{background:transparent;color:var(--ink-faint);border:1px solid var(--border);padding:0 10px;font-size:16px;line-height:1;height:100%;min-height:34px}
  .kill:hover{background:#fef2f2;color:var(--danger);border-color:#fecaca}

  .toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}

  /* ---- Timetable ---- */
  .board{background:var(--paper);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .board-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;border-bottom:1px solid var(--border);
  }
  .board-head .ttl{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end;font-size:11px;color:var(--ink-soft)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{
    font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-faint);text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);
    background:var(--panel);
  }
  tbody td{padding:0;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  .cell{padding:11px 12px}

  .c-time{width:118px;white-space:nowrap}
  .time-range{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px}
  .chip{width:4px;align-self:stretch;min-height:26px;border-radius:3px;background:var(--talk);flex:0 0 auto}
  .time-range .rng{display:flex;flex-direction:column;line-height:1.35}
  .time-range .rng small{font-size:10px;color:var(--ink-faint);font-weight:500}

  .c-kind{width:104px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.02em}
  .badge.talk{background:var(--panel-2);color:var(--ink-soft)}
  .badge.lunch{background:var(--lunch-bg);color:#b45309}
  .badge.break{background:var(--break-bg);color:#047857}
  .badge.custom{background:var(--custom-bg);color:#4338ca}

  .c-dur{width:70px;font-family:var(--mono);color:var(--ink-soft);font-size:12px;text-align:right}

  .c-move{width:44px}
  .mv{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;opacity:.3;transition:opacity .12s}
  tbody tr:hover .mv,.mv:focus-within{opacity:1}
  .grip{
    cursor:grab;color:var(--ink-faint);font-size:12px;line-height:1;font-family:var(--mono);
    padding:2px 7px;border-radius:5px;background:transparent;border:1px solid transparent;
  }
  .grip:hover{background:var(--panel-2);border-color:var(--border);color:var(--ink-soft)}
  .grip:active{cursor:grabbing}
  .arrows{display:flex;gap:2px}
  .mv-btn{
    font-size:8px;line-height:1;padding:3px 5px;border-radius:4px;
    color:var(--ink-faint);background:var(--paper);border:1px solid var(--border);
  }
  .mv-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  tr.dragging{opacity:.4}
  tr.drop-before td{box-shadow:inset 0 2px 0 0 var(--accent)}
  tr.drop-after td{box-shadow:inset 0 -2px 0 0 var(--accent)}

  tr.row-lunch{background:var(--lunch-bg)}
  tr.row-lunch .chip{background:var(--lunch)}
  tr.row-break{background:var(--break-bg)}
  tr.row-break .chip{background:var(--break)}
  tr.row-custom{background:var(--custom-bg)}
  tr.row-custom .chip{background:var(--custom)}
  tr.row-gap{background:repeating-linear-gradient(45deg,#fff,#fff 7px,#f8fafc 7px,#f8fafc 14px)}
  tr.row-gap .chip{background:var(--gap)}
  tr.row-gap td{color:var(--ink-faint)}

  .title-in{
    width:100%;border:1px solid transparent;background:transparent;border-radius:6px;
    padding:6px 8px;font-size:14px;font-weight:600;color:var(--ink);
  }
  .title-in::placeholder{color:var(--ink-faint);font-weight:400}
  .title-in:hover{border-color:var(--border)}
  .title-in:focus{outline:none;border-color:var(--accent);background:var(--paper);box-shadow:0 0 0 3px var(--accent-soft)}
  .sub-in{
    width:100%;border:1px solid transparent;background:transparent;border-radius:6px;
    padding:3px 8px;font-size:12px;color:var(--ink-soft);margin-top:1px;
  }
  .sub-in::placeholder{color:var(--ink-faint)}
  .sub-in:hover{border-color:var(--border)}
  .sub-in:focus{outline:none;border-color:var(--accent);background:var(--paper);box-shadow:0 0 0 3px var(--accent-soft)}
  .fixed-label{font-size:14px;font-weight:600;color:var(--ink);padding:6px 8px}

  .empty-board{padding:48px 20px;text-align:center;color:var(--ink-faint)}
  .empty-board b{display:block;color:var(--ink-soft);margin-bottom:4px;font-size:15px}

  .notice{
    margin-bottom:16px;padding:11px 14px;border-radius:9px;font-size:13px;
    display:none;align-items:flex-start;gap:9px;
  }
  .notice.show{display:flex}
  .notice.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
  .notice.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
  .notice.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
  .notice ul{margin:4px 0 0;padding-left:18px}

  .hint{font-size:11px;color:var(--ink-faint);margin-top:6px;line-height:1.45}

  /* ---- Print ---- */
  @media print{
    body{background:#fff;font-size:11px}
    .wrap{max-width:none;padding:0}
    .layout{display:block}
    .side,.toolbar,.board-head .legend,.notice,.hint,.kill,.title-in,.sub-in{}
    .side,.toolbar{display:none !important}
    .masthead{border-color:#000}
    .masthead .summary{display:none}
    .board{border:none;border-radius:0}
    .title-in,.sub-in{border:none;box-shadow:none;padding:2px 0}
    tbody td,thead th{border-color:#000}
    tr.row-gap{display:none}
    .c-move{display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1>タイムテーブル作成 <span class="en">Program Builder</span></h1>
    <div class="summary" id="summary"></div>
  </header>

  <div class="layout">

    <!-- ============ SIDE: SETTINGS ============ -->
    <div class="side">
      <div class="panel">
        <h2>基本設定</h2>
        <div class="field">
          <label for="s-start">開始時刻</label>
          <input type="time" id="s-start" value="09:00">
        </div>
        <div class="hint">開始時刻から順に発表コマを並べ、固定枠の前で区切ります。終了時刻は発表の件数と固定枠から決まります。</div>
      </div>

      <div class="panel">
        <h2>発表種別</h2>
        <div class="types" id="types"></div>
        <button class="btn ghost block small" id="add-type" style="margin-top:11px">＋ 種別を追加</button>
        <div class="hint">1コマ = 発表 + 質疑。種別ごとに件数を指定すると、上から順に配置されます（空欄にすると現在の件数のまま）。<br>発表の順序は表の行を<b>ドラッグ</b>、または<b>▲▼</b>で入れ替えられます（時刻は自動で振り直されます）。</div>
      </div>

      <div class="panel">
        <h2>ランチ</h2>
        <label class="inline-check" style="margin-bottom:12px">
          <input type="checkbox" id="s-lunch-on" checked> ランチ枠を設ける
        </label>
        <div class="row2">
          <div class="field">
            <label for="s-lunch-start">開始</label>
            <input type="time" id="s-lunch-start" value="12:00">
          </div>
          <div class="field">
            <label for="s-lunch-end">終了</label>
            <input type="time" id="s-lunch-end" value="13:00">
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>特別枠 / 休憩</h2>
        <div class="slots" id="slots"></div>
        <button class="btn ghost block small" id="add-slot" style="margin-top:11px">＋ 枠を追加</button>
        <div class="hint">休憩・基調講演・ポスター・授賞式など、発表以外の時間帯を自由に定義できます。</div>
      </div>

      <div class="panel">
        <h2>表示</h2>
        <label class="inline-check">
          <input type="checkbox" id="s-showgap" checked> 空き時間を表示
        </label>
      </div>
    </div>

    <!-- ============ MAIN: TIMETABLE ============ -->
    <div class="main">
      <div class="toolbar">
        <button class="btn" id="regen">設定から再生成</button>
        <button class="btn ghost" id="export">CSVエクスポート</button>
        <button class="btn ghost" id="import">CSVインポート</button>
        <button class="btn ghost" id="print">印刷 / PDF</button>
        <input type="file" id="file" accept=".csv,text/csv" hidden>
      </div>

      <div class="notice" id="notice"></div>

      <div class="board">
        <div class="board-head">
          <span class="ttl">Timetable</span>
          <div class="legend" id="legend"></div>
        </div>
        <div id="board-body"></div>
      </div>
    </div>

  </div>
</div>

<script>
"use strict";

/* ---------------- state ---------------- */
// 発表種別。count: 件数（null = 空欄。現在の件数を維持する）
let talkTypes = [
  { id: uid(), name: "発表", talk: 12, qa: 3, count: 20 }
];
let customSlots = [
  { id: uid(), start: "15:00", end: "15:15", label: "休憩", type: "break" }
];
// 発表の並び順そのもの。手動で入れ替え可能で、再生成をまたいで保持される
// {id, typeId, title, speaker}
let talkList = [];
let items = [];      // rendered rows
let refocus = null;  // 再描画後にフォーカスを戻す並べ替えボタン

/* ---------------- helpers ---------------- */
function uid(){ return Math.random().toString(36).slice(2,9); }
function toMin(t){
  if(!t) return null;
  const m=/^(\d{1,2}):(\d{2})$/.exec(String(t).trim());
  if(!m) return null;
  const h=+m[1], mi=+m[2];
  if(h>23||mi>59) return null;
  return h*60+mi;
}
function toStr(min){
  if(min==null||isNaN(min)) return "";
  min=Math.round(min);
  const h=Math.floor(min/60), m=((min%60)+60)%60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}
const $ = s => document.querySelector(s);

/* 発表種別の配色（定義順に割り当て） */
const TYPE_COLORS = [
  {chip:"#64748b", bg:"#f1f5f9", fg:"#475569"},
  {chip:"#0ea5e9", bg:"#e0f2fe", fg:"#0369a1"},
  {chip:"#8b5cf6", bg:"#ede9fe", fg:"#6d28d9"},
  {chip:"#ec4899", bg:"#fce7f3", fg:"#be185d"},
  {chip:"#14b8a6", bg:"#ccfbf1", fg:"#0f766e"},
  {chip:"#f97316", bg:"#ffedd5", fg:"#c2410c"}
];
const typeColor = i => TYPE_COLORS[i % TYPE_COLORS.length];
const typeLen = t => (t.talk||0) + (t.qa||0);
const newEntry = typeId => ({id:uid(), typeId, title:"", speaker:""});

function readSettings(){
  return {
    start: $("#s-start").value,
    lunchOn: $("#s-lunch-on").checked,
    lunchStart: $("#s-lunch-start").value,
    lunchEnd: $("#s-lunch-end").value,
    showGap: $("#s-showgap").checked
  };
}

/* ---------------- generation ---------------- */
function generate(){
  const s = readSettings();
  const start = toMin(s.start);
  const warnings = [];

  if(start==null){ renderNotice(["開始時刻を正しく入力してください。"],"err"); items=[]; render(); return; }

  // 発表種別
  const specById = new Map();
  talkTypes.forEach((t,i)=>{
    const spec = {id:t.id, name:t.name||`種別${i+1}`, len:typeLen(t), colorIdx:i};
    specById.set(t.id, spec);
    if(spec.len<=0 && t.count!==0)
      warnings.push(`発表種別「${spec.name}」は発表＋質疑が0分のため配置しません。`);
  });

  // 発表リストを種別の件数に合わせる（並び順は保持し、増減は末尾で行う）
  talkList = talkList.filter(e => specById.has(e.typeId));
  for(const t of talkTypes){
    if(t.count==null) continue;   // 空欄＝現在の件数のまま
    const idxs = [];
    talkList.forEach((e,i)=>{ if(e.typeId===t.id) idxs.push(i); });
    if(idxs.length > t.count){
      const drop = new Set(idxs.slice(t.count));       // 後ろの分から削除
      talkList = talkList.filter((e,i)=>!drop.has(i));
    } else {
      for(let n=idxs.length; n<t.count; n++) talkList.push(newEntry(t.id));
    }
  }
  if(!talkList.length) warnings.push("発表が0件です。発表種別の件数を指定してください。");

  // collect fixed slots
  let fixed = [];
  if(s.lunchOn){
    const ls=toMin(s.lunchStart), le=toMin(s.lunchEnd);
    if(ls!=null&&le!=null&&le>ls) fixed.push({type:"lunch",start:ls,end:le,label:"ランチ"});
    else warnings.push("ランチの時刻が不正です（開始<終了で指定してください）。");
  }
  customSlots.forEach(c=>{
    const cs=toMin(c.start), ce=toMin(c.end);
    if(cs!=null&&ce!=null&&ce>cs) fixed.push({type:c.type,start:cs,end:ce,label:c.label||"（無題）"});
    else if(c.start||c.end||c.label) warnings.push(`特別枠「${c.label||"無題"}」の時刻が不正です。`);
  });
  fixed.sort((a,b)=>a.start-b.start || a.end-b.end);

  // 開始時刻より前に終わる固定枠は無視する
  const outside = fixed.filter(f=>f.end<=start);
  if(outside.length){
    fixed = fixed.filter(f=>f.end>start);
    warnings.push(`開始時刻より前の枠（${outside.map(f=>f.label).join("・")}）は配置しませんでした。`);
  }

  // detect overlaps among fixed
  for(let i=1;i<fixed.length;i++){
    if(fixed[i].start<fixed[i-1].end)
      warnings.push(`固定枠が重複しています（${toStr(fixed[i-1].start)}–${toStr(fixed[i-1].end)} と ${toStr(fixed[i].start)}–${toStr(fixed[i].end)}）。`);
  }

  const out = [];
  let cursor = start;
  let li = 0;   // 発表リストの位置

  // to まで発表を並べる。to が null なら残りをすべて並べる
  function fill(to){
    while(li < talkList.length){
      const e = talkList[li];
      const spec = specById.get(e.typeId);
      if(!spec || spec.len<=0){ li++; continue; }   // 0分の種別は配置しない
      if(to!=null && cursor+spec.len>to) break;
      out.push({type:"talk",start:cursor,end:cursor+spec.len,
                entryId:e.id,typeName:spec.name,colorIdx:spec.colorIdx,
                title:e.title,speaker:e.speaker});
      cursor+=spec.len; li++;
    }
    if(to!=null && s.showGap && to-cursor>=1) out.push({type:"gap",start:cursor,end:to});
  }

  for(const f of fixed){
    if(f.start>cursor) fill(f.start);
    out.push(Object.assign({},f));
    cursor = Math.max(cursor, f.end);
  }
  fill(null);   // 残りは最後の固定枠のあとに続けて並べる

  items = out;
  renderNotice(warnings, warnings.length?"warn":"");
  render();
}

/* ---------------- rendering ---------------- */
const KIND = {
  talk:  {label:"発表",  cls:"talk"},
  lunch: {label:"ランチ", cls:"lunch"},
  break: {label:"休憩",  cls:"break"},
  custom:{label:"特別",  cls:"custom"}
};

function render(){
  const body = $("#board-body");

  const talkItems = items.filter(i=>i.type==="talk");
  const total = items.length ? items[items.length-1].end - items[0].start : 0;

  // 種別ごとの件数（定義順）
  const perType = new Map();
  for(const it of talkItems){
    const k = it.typeName||"発表";
    perType.set(k,(perType.get(k)||0)+1);
  }
  const breakdown = perType.size>1
    ? `（${[...perType].map(([n,c])=>`${esc(n)} ${c}`).join(" / ")}）` : "";

  $("#summary").innerHTML =
    `<span>発表 <b>${talkItems.length}</b> 件${breakdown}</span>` +
    `<span>枠 <b>${items.filter(i=>i.type!=="gap"&&i.type!=="talk").length}</b> 件</span>` +
    (total>0?`<span>会期 <b>${Math.floor(total/60)}h${String(total%60).padStart(2,"0")}m</b></span>`:"");

  renderLegend();

  if(!items.length){
    body.innerHTML = `<div class="empty-board"><b>タイムテーブルが空です</b>設定を入力して「設定から再生成」を押してください。</div>`;
    return;
  }

  let rows = "";
  let talkNo = 0;
  for(let idx=0; idx<items.length; idx++){
    const it = items[idx];
    const dur = it.end - it.start;

    if(it.type==="talk"){
      const c = typeColor(it.colorIdx||0);
      talkNo++;
      rows += `<tr data-idx="${idx}" data-entry="${it.entryId}">
        <td class="c-move"><div class="cell mv">
          <span class="grip" draggable="true" data-id="${it.entryId}" title="ドラッグで並べ替え">⠿</span>
          <span class="arrows">
            <button class="mv-btn" data-move="-1" data-id="${it.entryId}" title="上へ">▲</button>
            <button class="mv-btn" data-move="1" data-id="${it.entryId}" title="下へ">▼</button>
          </span>
        </div></td>
        <td class="c-time"><div class="cell"><div class="time-range">
          <span class="chip" style="background:${c.chip}"></span>
          <span class="rng">${toStr(it.start)}<small>– ${toStr(it.end)}</small></span>
        </div></div></td>
        <td class="c-kind"><div class="cell"><span class="badge" style="background:${c.bg};color:${c.fg}">${esc(it.typeName||"発表")}</span></div></td>
        <td><div class="cell" style="padding:7px 10px">
          <input class="title-in" data-field="title" data-idx="${idx}" placeholder="発表タイトル（${talkNo}）" value="${esc(it.title)}">
          <input class="sub-in" data-field="speaker" data-idx="${idx}" placeholder="発表者 / 所属" value="${esc(it.speaker)}">
        </div></td>
        <td class="c-dur"><div class="cell">${dur}分</div></td>
      </tr>`;
    } else if(it.type==="gap"){
      rows += `<tr class="row-gap">
        <td class="c-move"></td>
        <td class="c-time"><div class="cell"><div class="time-range">
          <span class="chip"></span>
          <span class="rng">${toStr(it.start)}<small>– ${toStr(it.end)}</small></span>
        </div></div></td>
        <td class="c-kind"><div class="cell"></div></td>
        <td><div class="cell fixed-label" style="font-weight:400;font-style:italic;color:var(--ink-faint)">空き時間</div></td>
        <td class="c-dur"><div class="cell">${dur}分</div></td>
      </tr>`;
    } else {
      const k = KIND[it.type] || KIND.custom;
      rows += `<tr class="row-${it.type}">
        <td class="c-move"></td>
        <td class="c-time"><div class="cell"><div class="time-range">
          <span class="chip"></span>
          <span class="rng">${toStr(it.start)}<small>– ${toStr(it.end)}</small></span>
        </div></div></td>
        <td class="c-kind"><div class="cell"><span class="badge ${k.cls}">${k.label}</span></div></td>
        <td><div class="cell fixed-label">${esc(it.label)}</div></td>
        <td class="c-dur"><div class="cell">${dur}分</div></td>
      </tr>`;
    }
  }

  body.innerHTML = `<table>
    <thead><tr>
      <th class="c-move"></th><th>時刻</th><th>種別</th><th>内容</th><th style="text-align:right">時間</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;

  // 並べ替えボタンを連打できるよう、再描画後にフォーカスを戻す
  if(refocus){
    const btn = body.querySelector(`.mv-btn[data-id="${refocus.id}"][data-move="${refocus.move}"]`);
    if(btn) btn.focus({preventScroll:false});
    refocus = null;
  }
}

function renderLegend(){
  const seg = [];
  talkTypes.forEach((t,i)=>{
    if(typeLen(t)<=0) return;
    seg.push(`<span><i style="background:${typeColor(i).chip}"></i>${esc(t.name||`種別${i+1}`)} ${typeLen(t)}分</span>`);
  });
  const has = k => items.some(i=>i.type===k);
  if(has("lunch"))  seg.push(`<span><i style="background:var(--lunch)"></i>ランチ</span>`);
  if(has("break"))  seg.push(`<span><i style="background:var(--break)"></i>休憩</span>`);
  if(has("custom")) seg.push(`<span><i style="background:var(--custom)"></i>特別</span>`);
  $("#legend").innerHTML = seg.join("");
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function renderNotice(msgs, type){
  const n = $("#notice");
  if(!msgs || !msgs.length){ n.className="notice"; n.innerHTML=""; return; }
  const icon = type==="ok"?"✓":type==="err"?"✕":"！";
  n.className = "notice show "+(type||"warn");
  n.innerHTML = `<span style="font-weight:700">${icon}</span><div>${
    msgs.length===1 ? esc(msgs[0]) : "<ul>"+msgs.map(m=>`<li>${esc(m)}</li>`).join("")+"</ul>"
  }</div>`;
}

/* ---------------- reorder ---------------- */
function moveEntry(id, delta){
  const i = talkList.findIndex(x=>x.id===id);
  const j = i + delta;
  if(i<0 || j<0 || j>=talkList.length) return;
  const [e] = talkList.splice(i,1);
  talkList.splice(j,0,e);
  refocus = {id, move:String(delta)};
  generate();
}
function dropEntry(dragId, refId, before){
  if(!dragId || !refId || dragId===refId) return;
  const from = talkList.findIndex(x=>x.id===dragId);
  if(from<0) return;
  const [e] = talkList.splice(from,1);
  const to = talkList.findIndex(x=>x.id===refId);
  if(to<0){ talkList.splice(from,0,e); return; }
  talkList.splice(before?to:to+1, 0, e);
  generate();
}
function clearDropMarks(){
  $("#board-body").querySelectorAll("tr.drop-before,tr.drop-after")
    .forEach(tr=>tr.classList.remove("drop-before","drop-after"));
}
function dropSide(tr, y){
  const r = tr.getBoundingClientRect();
  return (y - r.top) < r.height/2;
}

/* ---------------- talk types editor ---------------- */
function renderTypes(){
  const box = $("#types");
  if(!talkTypes.length){
    box.innerHTML = `<div class="type-empty">発表種別がありません</div>`;
    return;
  }
  box.innerHTML = talkTypes.map((t,i)=>`
    <div class="type-row" data-id="${t.id}">
      <div class="head">
        <span class="swatch" style="background:${typeColor(i).chip}"></span>
        <input class="name" type="text" data-k="name" placeholder="種別名（一般講演 等）" value="${esc(t.name)}">
      </div>
      <button class="kill" data-del="${t.id}" title="削除">×</button>
      <div class="nums">
        <div>
          <span class="mini">発表(分)</span>
          <input type="number" data-k="talk" min="0" step="1" value="${t.talk}">
        </div>
        <div>
          <span class="mini">質疑(分)</span>
          <input type="number" data-k="qa" min="0" step="1" value="${t.qa}">
        </div>
        <div>
          <span class="mini">件数</span>
          <input type="number" data-k="count" min="0" step="1" placeholder="－" value="${t.count==null?"":t.count}">
        </div>
      </div>
    </div>`).join("");
}

/* ---------------- slots editor ---------------- */
function renderSlots(){
  const box = $("#slots");
  if(!customSlots.length){
    box.innerHTML = `<div class="slot-empty">枠はまだありません</div>`;
    return;
  }
  box.innerHTML = customSlots.map(c=>`
    <div class="slot-row" data-id="${c.id}">
      <div class="times">
        <input type="time" data-k="start" value="${c.start||""}">
        <input type="time" data-k="end" value="${c.end||""}">
      </div>
      <input class="name" type="text" data-k="label" placeholder="名称（休憩・基調講演 等）" value="${esc(c.label)}">
      <select class="type" data-k="type">
        <option value="break" ${c.type==="break"?"selected":""}>休憩</option>
        <option value="custom" ${c.type==="custom"?"selected":""}>特別</option>
      </select>
      <button class="kill" data-del="${c.id}" title="削除">×</button>
    </div>`).join("");
}

/* ---------------- CSV ---------------- */
function csvCell(v){
  v = v==null ? "" : String(v);
  return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function exportCSV(){
  const header = ["開始時刻","終了時刻","種別","タイトル","発表者","発表種別"];
  const lines = [header.map(csvCell).join(",")];
  for(const it of items){
    if(it.type==="gap") continue;
    const kind = (KIND[it.type]||{}).label || "特別";
    const title = it.type==="talk" ? it.title : it.label;
    const speaker = it.type==="talk" ? it.speaker : "";
    const tname = it.type==="talk" ? (it.typeName||"") : "";
    lines.push([toStr(it.start),toStr(it.end),kind,title||"",speaker||"",tname].map(csvCell).join(","));
  }
  const blob = new Blob(["\uFEFF"+lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "timetable.csv";
  a.click();
  URL.revokeObjectURL(a.href);
  renderNotice(["CSVをエクスポートしました。"],"ok");
}

function parseCSV(text){
  text = text.replace(/^\uFEFF/,"");
  const rows=[]; let row=[]; let cur=""; let q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=ch;
    } else {
      if(ch==='"') q=true;
      else if(ch===","){ row.push(cur); cur=""; }
      else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(ch==="\r"){ /* skip */ }
      else cur+=ch;
    }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}

const KIND_FROM = {"発表":"talk","ランチ":"lunch","昼食":"lunch","休憩":"break","特別":"custom"};

function importCSV(text){
  let rows = parseCSV(text);
  if(!rows.length){ renderNotice(["CSVが空です。"],"err"); return; }

  // drop header if present
  const first = rows[0].map(c=>c.trim());
  if(/開始/.test(first[0]) || /start/i.test(first[0])) rows = rows.slice(1);

  const newItems = [];
  const newList = [];
  const newCustom = [];
  let lunchOn=false, lunchS="", lunchE="";
  const groups = new Map();   // 発表種別名（または長さ） -> {name,len,count}

  for(const r of rows){
    const start=toMin((r[0]||"").trim());
    const end=toMin((r[1]||"").trim());
    if(start==null||end==null) continue;
    const kindRaw=(r[2]||"").trim();
    const type = KIND_FROM[kindRaw] || "custom";
    const title=(r[3]||"").trim();
    const speaker=(r[4]||"").trim();
    const tname=(r[5]||"").trim();

    if(type==="talk"){
      const len = end-start;
      const key = tname || `len:${len}`;
      let g = groups.get(key);
      if(!g){ g={name:tname,len,count:0,key}; groups.set(key,g); }
      g.count++;
      const entry = {id:uid(), typeId:null, title, speaker, groupKey:key};
      newList.push(entry);
      newItems.push({type:"talk",start,end,title,speaker,entryId:entry.id,groupKey:key});
    } else if(type==="lunch"){
      newItems.push({type:"lunch",start,end,label:title||"ランチ"});
      lunchOn=true; lunchS=toStr(start); lunchE=toStr(end);
    } else {
      newItems.push({type,start,end,label:title||(type==="break"?"休憩":"特別")});
      newCustom.push({id:uid(),start:toStr(start),end:toStr(end),label:title||(type==="break"?"休憩":"特別"),type});
    }
  }

  if(!newItems.length){ renderNotice(["有効な行が見つかりませんでした。時刻の形式（HH:MM）をご確認ください。"],"err"); return; }

  // 発表種別を再構築（発表／質疑の内訳は既存定義から推定）
  const glist = [...groups.values()];
  const used = new Set(glist.map(g=>g.name).filter(Boolean));
  const newTypes = glist.map((g,i)=>{
    let name = g.name;
    if(!name){
      name = glist.length===1 ? "発表" : `種別${String.fromCharCode(65+i)}`;
      while(used.has(name)) name += "'";
      used.add(name);
    }
    const prev = talkTypes.find(t=>t.name===name && typeLen(t)===g.len)
              || talkTypes.find(t=>typeLen(t)===g.len);
    const qa = prev ? Math.min(prev.qa, g.len) : 0;
    g.typeIndex = i;
    return {id:uid(), name, talk:g.len-qa, qa, count:g.count};
  });
  for(const it of newItems){
    if(it.type!=="talk") continue;
    const g = groups.get(it.groupKey);
    it.typeName = newTypes[g.typeIndex].name;
    it.colorIdx = g.typeIndex;
    delete it.groupKey;
  }
  for(const e of newList){
    e.typeId = newTypes[groups.get(e.groupKey).typeIndex].id;
    delete e.groupKey;
  }

  // sync panel state so 再生成 stays consistent
  items = newItems;
  talkList = newList;
  customSlots = newCustom;
  if(newTypes.length) talkTypes = newTypes;
  $("#s-start").value = toStr(newItems[0].start);
  $("#s-lunch-on").checked = lunchOn;
  if(lunchOn){ $("#s-lunch-start").value=lunchS; $("#s-lunch-end").value=lunchE; }

  renderTypes();
  renderSlots();
  render();
  renderNotice([`CSVを読み込みました（${newItems.length}行）。設定パネルにも反映済みです。発表と質疑の内訳は推定値です。`],"ok");
}

/* ---------------- events ---------------- */
// settings -> regenerate (interactive)
["s-start","s-lunch-on","s-lunch-start","s-lunch-end","s-showgap"]
  .forEach(id => $("#"+id).addEventListener("input", generate));

$("#regen").addEventListener("click", generate);
$("#print").addEventListener("click", ()=>window.print());
$("#export").addEventListener("click", exportCSV);
$("#import").addEventListener("click", ()=>$("#file").click());
$("#file").addEventListener("change", e=>{
  const f=e.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=ev=>importCSV(ev.target.result);
  reader.readAsText(f,"utf-8");
  e.target.value="";
});

// talk type add
$("#add-type").addEventListener("click", ()=>{
  const last = talkTypes[talkTypes.length-1];
  const used = new Set(talkTypes.map(t=>t.name));
  let name = "種別A";
  for(let i=0;i<26 && used.has(name);i++) name = `種別${String.fromCharCode(65+i+1)}`;
  talkTypes.push({
    id: uid(),
    name,
    talk: last ? last.talk : 12,
    qa: last ? last.qa : 3,
    count: 1
  });
  renderTypes(); generate();
});
// talk type edit / delete (delegation)
$("#types").addEventListener("input", e=>{
  const row=e.target.closest(".type-row"); if(!row) return;
  const t=talkTypes.find(x=>x.id===row.dataset.id); if(!t) return;
  const k=e.target.dataset.k; if(!k) return;
  if(k==="name") t.name=e.target.value;
  else if(k==="count") t.count = e.target.value.trim()==="" ? null : Math.max(0,parseInt(e.target.value,10)||0);
  else t[k] = Math.max(0,parseInt(e.target.value,10)||0);
  generate();
});
$("#types").addEventListener("click", e=>{
  const del=e.target.dataset.del; if(!del) return;
  talkTypes=talkTypes.filter(x=>x.id!==del);
  renderTypes(); generate();
});

// custom slot add
$("#add-slot").addEventListener("click", ()=>{
  const last = customSlots[customSlots.length-1];
  const base = last ? toMin(last.end) : toMin($("#s-start").value);
  const s = base!=null ? toStr(base) : "15:00";
  const e = base!=null ? toStr(base+15) : "15:15";
  customSlots.push({id:uid(),start:s,end:e,label:"休憩",type:"break"});
  renderSlots(); generate();
});
// custom slot edit / delete (delegation)
$("#slots").addEventListener("input", e=>{
  const row=e.target.closest(".slot-row"); if(!row) return;
  const c=customSlots.find(x=>x.id===row.dataset.id); if(!c) return;
  const k=e.target.dataset.k; if(k) c[k]=e.target.value;
  generate();
});
$("#slots").addEventListener("click", e=>{
  const del=e.target.dataset.del; if(!del) return;
  customSlots=customSlots.filter(x=>x.id!==del);
  renderSlots(); generate();
});

// inline talk editing (delegation) — no regenerate, just persist
$("#board-body").addEventListener("input", e=>{
  const t=e.target;
  if(!t.classList.contains("title-in") && !t.classList.contains("sub-in")) return;
  const idx=+t.dataset.idx, field=t.dataset.field;
  const it=items[idx]; if(!it||it.type!=="talk") return;
  it[field]=t.value;
  const en = talkList.find(x=>x.id===it.entryId);
  if(en) en[field]=t.value;
});

/* ---- 並べ替え（▲▼ / ドラッグ＆ドロップ） ---- */
let dragId = null;

$("#board-body").addEventListener("click", e=>{
  const b = e.target.closest(".mv-btn"); if(!b) return;
  moveEntry(b.dataset.id, parseInt(b.dataset.move,10));
});

$("#board-body").addEventListener("dragstart", e=>{
  const g = e.target.closest(".grip");
  if(!g){ e.preventDefault(); return; }   // 入力欄のテキストドラッグは無効化
  dragId = g.dataset.id;
  const tr = g.closest("tr");
  e.dataTransfer.effectAllowed = "move";
  try{ e.dataTransfer.setData("text/plain", dragId); }catch(_){}
  if(tr){
    e.dataTransfer.setDragImage(tr, 24, 14);
    setTimeout(()=>tr.classList.add("dragging"), 0);
  }
});
$("#board-body").addEventListener("dragover", e=>{
  if(!dragId) return;
  const tr = e.target.closest("tr[data-entry]");
  if(!tr || tr.dataset.entry===dragId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  clearDropMarks();
  tr.classList.add(dropSide(tr, e.clientY) ? "drop-before" : "drop-after");
});
$("#board-body").addEventListener("drop", e=>{
  if(!dragId) return;
  e.preventDefault();
  const tr = e.target.closest("tr[data-entry]");
  clearDropMarks();
  if(tr) dropEntry(dragId, tr.dataset.entry, dropSide(tr, e.clientY));
  dragId = null;
});
$("#board-body").addEventListener("dragend", ()=>{
  clearDropMarks();
  const d = $("#board-body").querySelector("tr.dragging");
  if(d) d.classList.remove("dragging");
  dragId = null;
});

/* ---------------- init ---------------- */
renderTypes();
renderSlots();
generate();
</script>
</body>
</html>
