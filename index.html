<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>発表申込 / 参加登録</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/base.css">
</head>
<body>

<div class="demo-bar" id="demo-bar">
  <b>デモモード</b>
  <span>サーバーに接続していないため、登録内容はこのブラウザ（localStorage）にのみ保存されます。</span>
  <span class="sep">|</span>
  <span>参加登録キー：<code style="background:#334155;color:#e2e8f0">demo</code></span>
  <span class="sep">|</span>
  <button type="button" id="demo-reset">デモデータを初期化</button>
</div>

<div class="wrap narrow">

  <header class="masthead">
    <h1><span id="event-name">発表申込</span> <span class="en">Registration</span></h1>
    <div class="summary" id="event-meta"></div>
    <div class="tools">
      <a class="btn ghost small" id="program-link" href="program.html" hidden>プログラム</a>
      <a class="btn ghost small" href="admin.html">管理画面</a>
    </div>
  </header>

  <div class="notice" id="notice"></div>

  <div class="panel" id="notice-panel" hidden>
    <h2>ご案内</h2>
    <div id="event-notice" style="font-size:13px;white-space:pre-wrap"></div>
  </div>

  <div class="panel" id="form-panel">
    <h2>発表申込<span class="tail" id="form-tail"></span></h2>

    <div class="skeleton" id="loading">読み込み中…</div>

    <form id="form" hidden novalidate>
      <div class="field">
        <label for="f-type">種別<span class="req">*</span></label>
        <select id="f-type" required></select>
        <div class="hint" id="type-hint"></div>
        <div class="field-err" id="e-type"></div>
      </div>

      <div class="field">
        <label for="f-title">タイトル<span class="req">*</span></label>
        <input type="text" id="f-title" maxlength="300" autocomplete="off"
               placeholder="発表タイトル" required>
        <div class="field-err" id="e-title"></div>
      </div>

      <div class="row2">
        <div class="field">
          <label for="f-speaker">発表者<span class="req">*</span></label>
          <input type="text" id="f-speaker" maxlength="200" autocomplete="name"
                 placeholder="山田 太郎" required>
          <div class="field-err" id="e-speaker"></div>
        </div>
        <div class="field">
          <label for="f-affiliation">所属<span class="req">*</span></label>
          <input type="text" id="f-affiliation" maxlength="200" autocomplete="organization"
                 placeholder="○○大学 △△研究科" required>
          <div class="field-err" id="e-affiliation"></div>
        </div>
      </div>

      <div class="field" id="key-field" hidden>
        <label for="f-key">参加登録キー<span class="req">*</span></label>
        <input type="password" id="f-key" maxlength="200" autocomplete="off"
               placeholder="事務局から配布されたキー">
        <div class="hint">主催者から配布された参加登録キーを入力してください。</div>
        <div class="field-err" id="e-key"></div>
      </div>

      <button type="submit" class="btn big block" id="submit" style="margin-top:18px">この内容で登録する</button>
      <div class="hint" style="text-align:center">1件ずつ登録してください。複数の発表がある場合は登録を繰り返してください。</div>
    </form>

    <div class="done-card" id="done" hidden>
      <div class="mark">&#10003;</div>
      <h3>登録が完了しました</h3>
      <p>受付番号：<span class="pill" id="done-id"></span></p>
      <div class="recap">
        <dl>
          <dt>種別</dt><dd id="r-type"></dd>
          <dt>タイトル</dt><dd id="r-title"></dd>
          <dt>発表者</dt><dd id="r-speaker"></dd>
          <dt>所属</dt><dd id="r-affiliation"></dd>
        </dl>
      </div>
      <button type="button" class="btn ghost" id="again">続けて登録する</button>
    </div>
  </div>

</div>

<script src="assets/api.js"></script>
<script src="assets/register.js"></script>
</body>
</html>
