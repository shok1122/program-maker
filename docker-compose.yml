services:
  program-maker:
    build: .
    image: program-maker
    container_name: program-maker
    restart: unless-stopped
    ports:
      # HTTPS で公開するとき（caddy プロファイル）は .env で HOST_BIND=127.0.0.1 にして、
      # 平文の 8080 番をインターネットに出さないでください。
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-8080}:8080"
    environment:
      # 管理画面（登録一覧 / タイムテーブル / 設定）のパスワード（必須）
      # 平文ではなくハッシュ値。`make password` で作って .env に貼り付けてください。
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH を .env に設定してください（make password で作れます）}
      # 以下はいずれも任意
      REGISTRATION_KEY: ${REGISTRATION_KEY:-}   # 参加登録キーの初期値（初回起動時のみ）
      EVENT_NAME: ${EVENT_NAME:-}               # イベント名の初期値（初回起動時のみ）
      COOKIE_SECURE: ${COOKIE_SECURE:-0}        # HTTPS で公開するなら 1
      SESSION_HOURS: ${SESSION_HOURS:-12}
      TRUST_PROXY: ${TRUST_PROXY:-0}            # リバースプロキシ配下なら 1
    volumes:
      - program-data:/data
      # 発表種別の定義。書き換えて再起動すれば反映されます（再ビルド不要）
      - ./config:/app/config:ro

  # HTTPS で公開する場合だけ起動するリバースプロキシ。証明書の取り方で2通りあります。
  #   make up-https              Let's Encrypt で取得・自動更新する（Caddyfile）
  #   make up-https-selfsigned   オレオレ証明書（自己署名）を Caddy 自身が発行する（Caddyfile.selfsigned）
  # どちらも 80/443 番を使うので同時には起動できません。ドメイン名などは .env に書きます。
  caddy:
    image: caddy:2-alpine
    container_name: program-maker-caddy
    restart: unless-stopped
    profiles: ["https"]
    ports:
      - "80:80"        # HTTP-01 チャレンジと HTTPS へのリダイレクトに必要
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      # 証明書を出す公開先（必須）。オレオレ証明書の場合はホスト名や IP アドレスをカンマ区切りで並べられます
      SITE_ADDRESS: ${SITE_ADDRESS:-}
      ACME_EMAIL: ${ACME_EMAIL:-}       # Let's Encrypt に登録するメールアドレス（make up-https のとき必須）
      # 動作確認中はステージング環境（.env 参照）に向けると発行回数の制限に掛かりません
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      # IP アドレスで繋がれたときに使う証明書（オレオレ証明書のときだけ意味があります）。
      # 空なら make up-https-selfsigned が SITE_ADDRESS の先頭を渡します
      DEFAULT_SNI: ${DEFAULT_SNI:-}
    volumes:
      # 既定は Let's Encrypt 用の設定。make up-https-selfsigned は Caddyfile.selfsigned を渡します
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # 証明書と秘密鍵（オレオレ証明書のときは CA の鍵も）。消すと作り直しになります
      - caddy-config:/config
    depends_on:
      - program-maker

volumes:
  program-data:
  caddy-data:
  caddy-config:
